name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug & release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/NFT-India-demo-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/NFT-India-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NFT-India-demo-apk
          path: out/*.apk
      - name: Publish to "latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-latest
          name: NFT India demo (latest build)
          body: Auto-built demo APK. Install NFT-India-demo.apk on any Android 7+ phone.
          prerelease: true
          files: out/NFT-India-demo.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write

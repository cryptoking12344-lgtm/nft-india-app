plugins { id 'com.android.application' }

android {
    namespace 'com.nftindia.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.nftindia.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0-demo"
    }
    buildTypes {
        release {
            minifyEnabled false
            // Demo: release is signed with the debug key so it installs directly
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    aaptOptions { noCompress 'ttf', 'otf' }
}
